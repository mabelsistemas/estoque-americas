name: Backup Diario do Firebase Realtime Database

on:
  schedule:
    # Executa todos os dias à meia-noite (00:00 UTC)
    - cron: '0 0 * * *'
  # Permite rodar o backup manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Instalar biblioteca do Firebase Admin
      run: npm install firebase-admin

    - name: Executar script de Backup
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        node -e '
        const admin = require("firebase-admin");
        const fs = require("fs");

        const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

        admin.initializeApp({
          credential: admin.credential.cert(serviceAccount),
          databaseURL: "https://iepeges-default-rtdb.firebaseio.com"
        });

        const db = admin.database();
        db.ref("/").once("value", (snapshot) => {
          const data = snapshot.val();
          if (!fs.existsSync("backups")) {
            fs.mkdirSync("backups");
          }
          const date = new Date().toISOString().split("T")[0];
          fs.writeFileSync(`backups/backup-${date}.json`, JSON.stringify(data, null, 2));
          console.log("Backup gerado com sucesso!");
          process.exit(0);
        }, (error) => {
          console.error("Erro ao fazer backup:", error);
          process.exit(1);
        });
        '

    - name: Salvar arquivo no Repositório
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add backups/
        git commit -m "Automated Firebase backup [skip ci]" || exit 0
        git push
